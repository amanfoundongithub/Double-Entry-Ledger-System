name: Angular CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ledger-core-ui

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ledger-core-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint TypeScript and templates
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build production bundle
        run: npm run build
